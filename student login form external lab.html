
<!DOCTYPE html>
<html>
<head>
    <title>Student Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
        }

        .login-box {
            width: 350px;
            margin: 100px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            text-align: center;
        }

        h2 {
            color: blue;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            width: 95%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Student Login</h2>

        <form>
            <input type="text"
                   placeholder="Enter Student ID"
                   required>

            <input type="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">Login</button>
        </form>

        <p>Forgot Password?</p>
        <p>New Student? Register Here</p>
    </div>

</body>
</html>
